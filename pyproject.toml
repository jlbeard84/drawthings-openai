[project]
name = "drawthings-openai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josh Beard", email = "josh@jlbeard.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "flatbuffers",
    "grpcio",
    "protobuf",
    "pydantic-settings>=2.14.2",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
exclude = [
    "src/drawthings_openai/generated"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]   # pycodestyle, pyflakes, isort, pyupgrade

[tool.ty.src]
exclude = [
    "src/drawthings_openai/generated"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: requires a live Draw Things server",
]
